{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Sign up for: {{ event.title }}</h2>
    
    <div class="card mb-4" style="padding: 15px; background-color: #f9f9f9; border: 1px solid #ddd;">
        <p><strong>Date:</strong> {{ event.start_time }}</p>
        <p><strong>Location:</strong> {{ event.location }}</p>
        <p><strong>Capacity Remaining:</strong> {{ spots_remaining }} spots left</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label for="new_registrant"><strong>Your Full Name:</strong></label><br>
            <input type="text" name="new_registrant" id="new_registrant" required placeholder="John Doe" style="width: 100%; max-width: 400px; padding: 8px;">
        </div>
        
        <button type="submit" class="btn btn-success">Confirm Registration</button>
    </form>
    
    <br>
    <a href="{% url 'localevents:event_detail' event.pk %}">Go Back</a>
</div>
{% endblock %}
