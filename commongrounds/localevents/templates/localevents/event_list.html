<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Events</title>
</head>
<body>
    <h1>Local Events</h1>
    <ul>
        {% for event in events %}
            <li>
                <a href="{% url 'localevents:event_detail' event.pk %}">{{ event.title }}</a> 
                - Starts: {{ event.start_time|date:"F j, Y, g:i a" }}
            </li>
        {% empty %}
            <li>No local events available at this time.</li>
        {% endfor %}
    </ul>
</body>
</html>
