{% extends 'base.html' %}

{% block content %}
<div class="event-delete">
    <h2>Cancel Event</h2>
    <p>Are you absolutely sure you want to permanently cancel and delete the event: <strong>"{{ object.title }}"</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: darkred; color: white;">Yes, Delete Event</button>
    </form>
    
    <br>
    <a href="{% url 'localevents:event_detail' object.pk %}">Nevermind, take me back.</a>
</div>
{% endblock %}
