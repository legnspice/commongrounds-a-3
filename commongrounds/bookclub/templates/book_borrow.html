{% extends 'base.html' %}
{% load static %}

{% block style %}
    <link rel="stylesheet" href="{% static 'css/mc_form.css' %}">
{% endblock %}
{% block body_class %}theme-bookclub{% endblock %}
{% block content %}
<div class="mc-form-page">
  <div class="mc-form-container">
    <p class="mc-form-title">Borrow</p>

    <div class="mc-form-body">

      <!-- item slot: book info -->
      <div class="mc-item-slot-panel">
        <div class="mc-item-slot">
          <!-- drop your enchanted book SVG here -->
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="9" width="18" height="14" fill="#c8820a"/>
            <rect x="7" y="9" width="3" height="14" fill="#a06008"/>
            <rect x="10" y="10" width="14" height="12" fill="#e8d5a0"/>
            <rect x="11" y="12" width="10" height="1" fill="#c8b880"/>
            <rect x="11" y="14" width="10" height="1" fill="#c8b880"/>
            <rect x="11" y="16" width="7" height="1" fill="#c8b880"/>
            <rect x="14" y="8" width="4" height="2" fill="#d4a843"/>
            <rect x="14" y="22" width="4" height="2" fill="#d4a843"/>
          </svg>
        </div>
        <div class="mc-item-info">
          <p><strong>{{ book.title }}</strong></p>
          <p>{{ book.author }}</p>
          <p>{{ book.genre }}</p>
        </div>
      </div>

      <!-- enchant panel: form fields -->
      <div class="mc-enchant-panel">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mc-enchant-row">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
          </div>
          {% endfor %}
          <button type="submit" class="mc-submit-btn">Borrow</button>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
