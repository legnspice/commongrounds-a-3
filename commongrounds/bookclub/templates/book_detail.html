{% extends 'base.html' %}

{% block body %}
    <h2><a href="/bookclub/books">Book List</a></h2>
    <h3>{{book.title}} by: {{book.author}}</h3>
    <p>Genre: {{book.genre}} </p>
    <p>Publication Year: {{book.publicationYear}}</p>
    <p></p>
    <p>Created On: {{book.createdOn|date:"Y-m-d"}}</p>
    <p>Updated On: {{book.updatedOn|date:"Y-m-d"}}</p>
{% endblock %}
