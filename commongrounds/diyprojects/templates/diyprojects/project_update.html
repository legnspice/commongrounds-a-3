{% extends 'base.html' %}

{% block title %}Edit {{ project.title }}{% endblock %}

{% block content %}
    <h1>Edit {{ project.title }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>
    <a href="{% url 'diyprojects:project_detail' pk=project.pk %}">Cancel</a>
{% endblock %}
