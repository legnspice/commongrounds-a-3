{% extends 'base.html' %}

{% block content %}
<div class="login-page">
    <div class="login-container">
        <h1 class="mc-form-title">Reset Password</h1>
        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mc-submit-btn">Change Password</button>
        </form>
        {% else %}
            <p>Invalid password reset link.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
