{% extends 'base.html' %}

{% block content %}
<div class="login-page">
    <div class="login-container">
        <h1 class="mc-form-title">Login</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mc-submit-btn">Log In</button>
        </form>
        <a href="{% url 'password_reset' %}">Forgot password? Reset here</a>
    </div>
</div>
{% endblock %}
