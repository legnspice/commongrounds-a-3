{% extends 'base.html' %}

{% block content %}
<div class="login-page">

        <h1 class="mc-form-title">Reset Password</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mc-submit-btn">Reset</button>
        </form>
    </div>
</div>
{% endblock %}
